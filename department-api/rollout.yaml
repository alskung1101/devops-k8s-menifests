apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: department-api-rollout
  namespace: university
spec:
  replicas: 3
  selector:
    matchLabels:
      app: department-api
  template:
    metadata:
      labels:
        app: department-api
    spec:
      containers:
      - name: department-api
        image: alskung/department-service:47
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "256Mi"
            cpu: "1000m"
        ports:
        - containerPort: 8088
        startupProbe: 
          httpGet: 
            path: /actuator/health
            port: 8088
          failureThreshold: 10
          periodSeconds: 10
        livenessProbe: 
          httpGet: 
            path: /actuator/health/liveness
            port: 8088
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe: 
          httpGet: 
            path: /actuator/health/readiness
            port: 8088
          initialDelaySeconds: 5
          periodSeconds: 5
  strategy:
    blueGreen:
      activeService: department-api-active
      previewService: department-api-preview
      autoPromotionEnabled: false          
        